<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with STAR-X, your personal AI assistant.">
    <title>STAR-X AI</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <div class="logo" aria-label="STAR-X">⭐ STAR-X</div>
            <p class="subtitle">Your personal AI assistant</p>
        </header>

        <section id="chat" class="chat" aria-label="Conversation" aria-live="polite" aria-relevant="additions">
            <div class="message ai">
                <strong>STAR-X</strong>
                <p>Hello! I'm STAR-X. How can I help you today?</p>
            </div>
        </section>

        <form class="input-area" id="chatForm">
            <label class="visually-hidden" for="userInput">Message STAR-X</label>
            <input
                type="text"
                id="userInput"
                name="message"
                placeholder="Ask STAR-X anything..."
                autocomplete="off"
                required
            >
            <button id="sendButton" type="submit">Send</button>
        </form>
        <p id="status" class="status" role="status">Demo mode — connect an AI service to enable generated responses.</p>
    </main>

    <script>
        window.SPECTRO_CONFIG = { apiEndpoint: '/api/chat' };
    </script>
    <script src="Script.js" defer></script>
</body>
</html>
