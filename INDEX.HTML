<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STAR-X AI</title>

    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="logo">⭐ STAR-X</div>
            <div class="subtitle">Your personal AI assistant</div>
        </div>

        <div id="chat">

            <div class="message ai">
                <strong>STAR-X:</strong><br>
                Hello! I'm STAR-X. How can I help you today?
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Ask STAR-X anything..."
            >

            <button id="sendButton" type="button">Send</button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
