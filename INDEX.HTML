<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with STAR-X, your personal AI assistant.">
    <title>STAR-X AI</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <div class="logo" aria-label="STAR-X">⭐ STAR-X</div>
            <p class="subtitle">Your personal AI assistant</p>
        </header>

        <section id="chat" class="chat" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></section>

        <form class="input-area" id="chatForm">
            <label class="visually-hidden" for="userInput">Message STAR-X</label>
            <input type="text" id="userInput" name="message" placeholder="Ask STAR-X anything..." autocomplete="off" maxlength="4000" required>
            <button id="sendButton" type="submit">Send</button>
            <button id="clearButton" class="secondary-button" type="button">Clear</button>
        </form>
        <p id="status" class="status" role="status">Ready.</p>
    </main>

    <script>
        window.SPECTRO_CONFIG = { apiEndpoint: '/api/chat' };
    </script>
    <script src="Script.js" defer></script>
</body>
</html>
